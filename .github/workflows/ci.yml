name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Ruby lint
        run: bundle exec rubocop

      - name: Syntax Tree
        if: ${{ !cancelled() }}
        run: bundle exec stree check Gemfile Rakefile mini_vips.gemspec $(git ls-files '*.rb')

  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install --yes fonts-dejavu-core icc-profiles-free libvips-dev pkg-config

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile and test
        run: bundle exec rake compile test

  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux-gnu
            runner: ubuntu-24.04
            container: discourse/ruby:3.4-trixie-slim
          - platform: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            container: discourse/ruby:3.4-trixie-slim
          - platform: arm64-darwin
            runner: macos-15
            macos_deployment_target: "13.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install --yes build-essential fonts-dejavu-core icc-profiles-free libvips-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config vips

      - name: Setup Ruby
        if: runner.os == 'macOS'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install gems
        run: bundle install

      - name: Build and test platform gem
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          bundle exec rake build
          bundle exec rake test

      - name: Test installed gem
        run: |
          install_dir="$(mktemp -d)"
          gem install --install-dir "$install_dir" --local pkg/*.gem --no-document
          minitest_lib="$(bundle show minitest)/lib"
          GEM_HOME="$install_dir" GEM_PATH="$install_dir" ruby -I"$minitest_lib" test/mini_vips_test.rb

      - name: Upload platform gem
        uses: actions/upload-artifact@v4
        with:
          name: mini_vips-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download platform gems
        uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Release Gem
        uses: discourse/publish-rubygems-action@v3
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot
